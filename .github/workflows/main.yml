name: NSE Telegram Alerts

on:
  schedule:
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false

concurrency:
  group: nse-telegram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are available
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ] && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; }; then
            echo "::error::Secrets missing. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi
          echo "Secrets found."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: state/snapshot.json
          key: nse-snapshot-restore-only
          restore-keys: nse-snapshot-

      - name: Run engine and send Telegram message
        run: python nse_telegram.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Save snapshot for next run
        if: always() && hashFiles('state/snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/snapshot.json
          key: nse-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
